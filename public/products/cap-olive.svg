<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#565d42"/>
      <stop offset="46%" stop-color="#4a5039"/>
      <stop offset="100%" stop-color="#343828"/>
    </linearGradient>

    <pattern id="jersey" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#4a5039"/>
      <path d="M0 3.5 H7" stroke="#565d42" stroke-width="1" opacity=".30"/>
      <path d="M3.5 0 V7" stroke="#24261b" stroke-width="1" opacity=".22"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="79"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ground" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>

    <clipPath id="body"><path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>

  <!-- Cast shadow, offset down-right from the garment -->
  <g opacity="0.55" filter="url(#soft)" transform="translate(26 30)">
    <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="#000"/>
  </g>

  <!-- Garment -->
  <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="url(#cloth)"/>
  <g clip-path="url(#body)">
    <rect width="1000" height="1250" fill="url(#jersey)" opacity="0.5"/>

    <!-- Folds: soft strokes that follow how a flat-laid garment creases -->
    <g filter="url(#soft)" opacity="0.5">
      <path d="M356 340 Q392 640 336 1020" stroke="#24261b" stroke-width="44" fill="none"/>
      <path d="M660 350 Q618 660 676 1020" stroke="#24261b" stroke-width="38" fill="none"/>
      <path d="M500 300 Q512 600 500 1000" stroke="#565d42" stroke-width="30" fill="none" opacity=".65"/>
    </g>

    <g fill="#efeadf" opacity="0.86" transform="translate(380 464) scale(0.96)">
        <path d="M96 150 L150 177 L206 154 L232 118 L210 32 L120 128 Z"/>
        <path d="M20 98 L58 78 L54 56 L96 42 L122 74 L118 126 L136 158 L104 160 L88 124 L86 98 L54 106 Z"/>
      </g>

    <rect width="1000" height="1250" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Collar and hem sit slightly darker, as ribbing does -->
  <path d="M230 660 Q500 600 770 660 L770 700 Q500 640 230 700 Z" fill="#24261b" opacity="0.85"/>
  <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="none" stroke="#24261b" stroke-width="3" opacity="0.5"/>
</svg>