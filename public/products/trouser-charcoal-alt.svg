<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#35373c"/>
      <stop offset="46%" stop-color="#2e2f34"/>
      <stop offset="100%" stop-color="#202124"/>
    </linearGradient>

    <pattern id="jersey" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#2e2f34"/>
      <path d="M0 3.5 H7" stroke="#35373c" stroke-width="1" opacity=".30"/>
      <path d="M3.5 0 V7" stroke="#161719" stroke-width="1" opacity=".22"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="73"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ground" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>

    <clipPath id="body"><path d="M308 192 Q500 164 692 192 L710 312 Q718 448 704 586 L672 1186
        Q590 1204 530 1186 L500 706 L470 1186 Q410 1204 328 1186 L296 586
        Q282 448 290 312 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>

  <!-- Cast shadow, offset down-right from the garment -->
  <g opacity="0.55" filter="url(#soft)" transform="translate(26 30)">
    <path d="M308 192 Q500 164 692 192 L710 312 Q718 448 704 586 L672 1186
        Q590 1204 530 1186 L500 706 L470 1186 Q410 1204 328 1186 L296 586
        Q282 448 290 312 Z" fill="#000"/>
  </g>

  <!-- Garment -->
  <path d="M308 192 Q500 164 692 192 L710 312 Q718 448 704 586 L672 1186
        Q590 1204 530 1186 L500 706 L470 1186 Q410 1204 328 1186 L296 586
        Q282 448 290 312 Z" fill="url(#cloth)"/>
  <g clip-path="url(#body)">
    <rect width="1000" height="1250" fill="url(#jersey)" opacity="0.5"/>

    <!-- Folds: soft strokes that follow how a flat-laid garment creases -->
    <g filter="url(#soft)" opacity="0.5">
      <path d="M356 340 Q392 640 336 1020" stroke="#161719" stroke-width="44" fill="none"/>
      <path d="M660 350 Q618 660 676 1020" stroke="#161719" stroke-width="38" fill="none"/>
      <path d="M500 300 Q512 600 500 1000" stroke="#35373c" stroke-width="30" fill="none" opacity=".65"/>
    </g>

    

    <rect width="1000" height="1250" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Collar and hem sit slightly darker, as ribbing does -->
  <path d="M308 192 Q500 164 692 192 L696 244 Q500 218 304 244 Z" fill="#161719" opacity="0.85"/>
  <path d="M308 192 Q500 164 692 192 L710 312 Q718 448 704 586 L672 1186
        Q590 1204 530 1186 L500 706 L470 1186 Q410 1204 328 1186 L296 586
        Q282 448 290 312 Z" fill="none" stroke="#161719" stroke-width="3" opacity="0.5"/>
</svg>