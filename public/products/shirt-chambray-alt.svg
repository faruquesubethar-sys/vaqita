<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#576c91"/>
      <stop offset="46%" stop-color="#4b5d7d"/>
      <stop offset="100%" stop-color="#354158"/>
    </linearGradient>

    <pattern id="jersey" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#4b5d7d"/>
      <path d="M0 3.5 H7" stroke="#576c91" stroke-width="1" opacity=".30"/>
      <path d="M3.5 0 V7" stroke="#242d3c" stroke-width="1" opacity=".22"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ground" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>

    <clipPath id="body"><path d="M296 238 L420 244 L500 336 L580 244 L704 238 L912 326 L852 500 L764 468
        L780 1080 Q500 1108 220 1080 L236 468 L148 500 L88 326 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>

  <!-- Cast shadow, offset down-right from the garment -->
  <g opacity="0.55" filter="url(#soft)" transform="translate(26 30)">
    <path d="M296 238 L420 244 L500 336 L580 244 L704 238 L912 326 L852 500 L764 468
        L780 1080 Q500 1108 220 1080 L236 468 L148 500 L88 326 Z" fill="#000"/>
  </g>

  <!-- Garment -->
  <path d="M296 238 L420 244 L500 336 L580 244 L704 238 L912 326 L852 500 L764 468
        L780 1080 Q500 1108 220 1080 L236 468 L148 500 L88 326 Z" fill="url(#cloth)"/>
  <g clip-path="url(#body)">
    <rect width="1000" height="1250" fill="url(#jersey)" opacity="0.5"/>

    <!-- Folds: soft strokes that follow how a flat-laid garment creases -->
    <g filter="url(#soft)" opacity="0.5">
      <path d="M356 340 Q392 640 336 1020" stroke="#242d3c" stroke-width="44" fill="none"/>
      <path d="M660 350 Q618 660 676 1020" stroke="#242d3c" stroke-width="38" fill="none"/>
      <path d="M500 300 Q512 600 500 1000" stroke="#576c91" stroke-width="30" fill="none" opacity=".65"/>
    </g>

    

    <rect width="1000" height="1250" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Collar and hem sit slightly darker, as ribbing does -->
  <path d="M420 244 L500 336 L580 244 L562 232 L500 300 L438 232 Z" fill="#242d3c" opacity="0.85"/>
  <path d="M296 238 L420 244 L500 336 L580 244 L704 238 L912 326 L852 500 L764 468
        L780 1080 Q500 1108 220 1080 L236 468 L148 500 L88 326 Z" fill="none" stroke="#242d3c" stroke-width="3" opacity="0.5"/>
</svg>