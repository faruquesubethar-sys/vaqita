<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="46%" stop-color="#212125"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>

    <pattern id="jersey" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#212125"/>
      <path d="M0 3.5 H7" stroke="#26262b" stroke-width="1" opacity=".30"/>
      <path d="M3.5 0 V7" stroke="#101012" stroke-width="1" opacity=".22"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="70"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ground" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>

    <clipPath id="body"><path d="M300 196 Q500 168 700 196 L722 320 Q728 450 714 580 L680 1150
        Q592 1172 528 1150 L500 700 L472 1150 Q408 1172 320 1150 L286 580
        Q272 450 278 320 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>

  <!-- Cast shadow, offset down-right from the garment -->
  <g opacity="0.55" filter="url(#soft)" transform="translate(26 30)">
    <path d="M300 196 Q500 168 700 196 L722 320 Q728 450 714 580 L680 1150
        Q592 1172 528 1150 L500 700 L472 1150 Q408 1172 320 1150 L286 580
        Q272 450 278 320 Z" fill="#000"/>
  </g>

  <!-- Garment -->
  <path d="M300 196 Q500 168 700 196 L722 320 Q728 450 714 580 L680 1150
        Q592 1172 528 1150 L500 700 L472 1150 Q408 1172 320 1150 L286 580
        Q272 450 278 320 Z" fill="url(#cloth)"/>
  <g clip-path="url(#body)">
    <rect width="1000" height="1250" fill="url(#jersey)" opacity="0.5"/>

    <!-- Folds: soft strokes that follow how a flat-laid garment creases -->
    <g filter="url(#soft)" opacity="0.5">
      <path d="M356 340 Q392 640 336 1020" stroke="#101012" stroke-width="44" fill="none"/>
      <path d="M660 350 Q618 660 676 1020" stroke="#101012" stroke-width="38" fill="none"/>
      <path d="M500 300 Q512 600 500 1000" stroke="#26262b" stroke-width="30" fill="none" opacity=".65"/>
    </g>

    

    <rect width="1000" height="1250" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Collar and hem sit slightly darker, as ribbing does -->
  <path d="M300 196 Q500 168 700 196 L704 254 Q500 226 296 254 Z" fill="#101012" opacity="0.85"/>
  <path d="M300 196 Q500 168 700 196 L722 320 Q728 450 714 580 L680 1150
        Q592 1172 528 1150 L500 700 L472 1150 Q408 1172 320 1150 L286 580
        Q272 450 278 320 Z" fill="none" stroke="#101012" stroke-width="3" opacity="0.5"/>
</svg>