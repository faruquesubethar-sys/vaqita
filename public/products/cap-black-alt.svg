<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="cloth" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#292a2e"/>
      <stop offset="46%" stop-color="#232428"/>
      <stop offset="100%" stop-color="#19191c"/>
    </linearGradient>

    <pattern id="jersey" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#232428"/>
      <path d="M0 3.5 H7" stroke="#292a2e" stroke-width="1" opacity=".30"/>
      <path d="M3.5 0 V7" stroke="#111113" stroke-width="1" opacity=".22"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="78"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ground" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1b1c20"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>

    <clipPath id="body"><path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>

  <!-- Cast shadow, offset down-right from the garment -->
  <g opacity="0.55" filter="url(#soft)" transform="translate(26 30)">
    <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="#000"/>
  </g>

  <!-- Garment -->
  <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="url(#cloth)"/>
  <g clip-path="url(#body)">
    <rect width="1000" height="1250" fill="url(#jersey)" opacity="0.5"/>

    <!-- Folds: soft strokes that follow how a flat-laid garment creases -->
    <g filter="url(#soft)" opacity="0.5">
      <path d="M356 340 Q392 640 336 1020" stroke="#111113" stroke-width="44" fill="none"/>
      <path d="M660 350 Q618 660 676 1020" stroke="#111113" stroke-width="38" fill="none"/>
      <path d="M500 300 Q512 600 500 1000" stroke="#292a2e" stroke-width="30" fill="none" opacity=".65"/>
    </g>

    

    <rect width="1000" height="1250" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
  </g>

  <!-- Collar and hem sit slightly darker, as ribbing does -->
  <path d="M230 660 Q500 600 770 660 L770 700 Q500 640 230 700 Z" fill="#111113" opacity="0.85"/>
  <path d="M230 660 Q230 372 500 372 Q770 372 770 660 L880 692 Q886 752 830 770
        L230 770 Z" fill="none" stroke="#111113" stroke-width="3" opacity="0.5"/>
</svg>